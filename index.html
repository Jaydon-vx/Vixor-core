<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vixor Core - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">Vixor Core</div>

    <nav>
      <a href="#nexus">Nexus</a>
      <a href="#pulseai">PulseAI</a>
      <a href="#skybots">Innovations</a>
      <a href="#media">Media Center</a>

      <div class="dropdown">
        <button class="dropbtn">More</button>
        <div class="dropdown-content">
          <a href="settings.html">Settings</a>
          <a href="mission.html">Mission</a>
          <a href="token.html">Token</a>
          <a href="reserve.html">Reserve</a>
          <a href="roadmap.html">Roadmap</a>
          <a href="help.html">Help</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Rotating Banner -->
  <section class="rotating-banner">
    <p id="rotatingText">🚀 Welcome to Vixor Core!</p>
  </section>

  <!-- Sidebar -->
  <button id="toggleSidebarBtn">☰</button>

  <aside id="sidebar">
    <a href="profile.html">Profile</a>
    <a href="notifications.html">Notifications</a>
    <a href="language.html">Language</a>
    <a href="deposit.html">Deposit Funds</a>
    <a href="#transact">Transact</a>
    <a href="#fleet">Drone Fleet</a>
    <a href="logout.html">Logout</a>

    <div id="clock"></div>
  </aside>

  <!-- Search -->
  <div class="search-filter-wrapper">
    <input type="text" id="searchInput" placeholder="Search drones..." />

    <select id="filterSelect">
      <option value="all">All Categories</option>
      <option value="SkyBots">SkyBots</option>
      <option value="PulseAI">PulseAI</option>
      <option value="Nexus">Nexus</option>
      <option value="space">Space Tech</option>
    </select>
  </div>

  <!-- Content -->
  <div class="container" id="content"></div>

  <!-- Footer -->
  <footer>
    <p>Vixor Core © 2026 | All rights reserved.</p>
  </footer>

  <!-- Script -->
  <script>
    const messages = [
      "🚀 Welcome to Vixor Core!",
      "💸 Deposit Funds Anytime!",
      "🧾 Complete Your Profile!",
      "🛰️ New drones coming soon!",
      "🎁 Invite friends & earn rewards!"
    ];

    let i = 0;
    const text = document.getElementById("rotatingText");

    setInterval(() => {
      text.style.opacity = "0";

      setTimeout(() => {
        i = (i + 1) % messages.length;
        text.textContent = messages[i];
        text.style.opacity = "1";
      }, 400);
    }, 3000);

    // sidebar toggle
    const sidebar = document.getElementById("sidebar");
    const btn = document.getElementById("toggleSidebarBtn");

    btn.onclick = () => {
      sidebar.classList.toggle("open");
    };

    // clock
    function clock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString();
    }

    setInterval(clock, 1000);
    clock();
  </script>

</body>
    </html>
