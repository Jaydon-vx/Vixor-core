<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Drone - Vixor Core</title>
  <link rel="stylesheet" href="reserve.css">
</head>
<body>

<header>
  <div class="logo">Vixor Core</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="mission.html">Mission</a>
    <a href="profile.html">Profile</a>
    <a href="settings.html">Settings</a>
    <a href="logout.html">Logout</a>
  </nav>
</header>

<section class="reserve-container">
  <h2>Reserve Your Drone</h2>

  <p>Be the first to own the latest Vixor Core flying robots!  
     Reserve your drone today and secure your future with AI flight technology.
  </p>

  <form id="reserveForm">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" required>

    <label for="droneModel">Choose Drone Model:</label>
    <select id="droneModel" required onchange="updateProducts()">
      <option value="VX Prime X9">VX Prime X9</option>
      <option value="VX Nova Core">VX Nova Core</option>
      <option value="VX Blaze AI">VX Blaze AI</option>
      <option value="VX Helios Ultra">VX Helios Ultra</option>
      <option value="VX Velocity Hover">VX Velocity Hover</option>
    </select>

    <label for="productOption">Choose Product Type:</label>
    <select id="productOption" required>
      <option value="">Please select a model first</option>
    </select>

    <button type="submit">Reserve Now</button>
  </form>
</section>

<script>
  const productData = {
    "VX Prime X9": ["Prime Basic AI", "Prime Pro Navigation", "Prime Elite Stamina"],
    "VX Nova Core": ["Nova Speedster", "Nova Silent Scout", "Nova Max Shield"],
    "VX Blaze AI": ["Blaze Flamebot", "Blaze Wing AI", "Blaze Ultra Pro"],
    "VX Helios Ultra": ["Helios Solar Hover", "Helios Command Drone", "Helios Titan Core"],
    "VX Velocity Hover": ["Velocity Light", "Velocity Max Power", "Velocity Flex Mini"]
  };

  function updateProducts() {
    const model = document.getElementById('droneModel').value;
    const productSelect = document.getElementById('productOption');
    productSelect.innerHTML = '';

    if (productData[model]) {
      productData[model].forEach(product => {
        const option = document.createElement('option');
        option.value = product;
        option.textContent = product;
        productSelect.appendChild(option);
      });
    } else {
      const defaultOption = document.createElement('option');
      defaultOption.value = "";
      defaultOption.textContent = "Please select a model first";
      productSelect.appendChild(defaultOption);
    }
  }
</script>

<script src="reserve.js"></script>

</body>
</html>
